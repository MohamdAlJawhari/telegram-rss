name: Update Telegram RSS feeds

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate RSS feeds
        run: python scraper.py

      - name: Commit changes
        run: |
          git config user.name "telegram-rss-bot"
          git config user.email "telegram-rss-bot@users.noreply.github.com"
          git add feeds/

          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "Update Telegram RSS feeds"
            git push
          fi